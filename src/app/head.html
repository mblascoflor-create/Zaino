<title>Zaino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wdth,wght@75..150,300..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* Zaino — base «Cartolina» (feed vertical: una pregunta por pantalla, respuestas como pegatinas) con la capa
   «Cuaderno de viaje» encima (papel verde claro, títulos en Georgia). Las variables de color viven SOLO aquí:
   son los valores que de verdad se ven (antes se definían dos veces y la segunda pisaba la primera). */
:root{
  /* paleta Zaino: turquesa (acción), sol (acento), coral (lo destacado), uva y marrón (tinta) */
  --teal:#4EAAA0; --teal-d:#2F7F77; --sol:#EFC65B; --coral:#F47762; --uva:#754A77; --marron:#30231F;
  --teal:#568f75; /* la capa Cuaderno pisaba el #4EAAA0 de arriba */
  --paper:#f1f2e9; --ink:#202d27; --ink2:#506256; --line:#ced7cb; --card:#fafbf5; --chip:#e6e9dd;
  --signal:#a13422; --signal-ink:#30231F; --cta:#164836; --cta-ink:#fff; --ok:#2F7F77; --okbg:#DDF0EC; --warn:#8A5A00; --warnbg:#FBEBC2;
  --z1:#EFC65B; --z2:#4EAAA0; --z3:#F47762; --zbg:#FBEBC2;
  --f-d:"TikTok Sans","Archivo","Arial Narrow",system-ui,-apple-system,sans-serif;
  --f-a:"Bodoni Moda","Bodoni 72",Didot,"Times New Roman",serif;
  --f-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --tab-h:66px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#17231e; --ink:#edf2e8; --ink2:#bbcbbb; --line:#43574a; --card:#202f27; --chip:#2b3d32;
    --signal:#ffa68e; --cta:#b9dc9f; --cta-ink:#14271d; --teal-d:#7CCFC4; --okbg:#173733; --ok:#7CCFC4; --warnbg:#3A2D10; --warn:#F5D486; color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#17231e; --ink:#edf2e8; --ink2:#bbcbbb; --line:#43574a; --card:#202f27; --chip:#2b3d32;
  --signal:#ffa68e; --cta:#b9dc9f; --cta-ink:#14271d; --teal-d:#7CCFC4; --okbg:#173733; --ok:#7CCFC4; --warnbg:#3A2D10; --warn:#F5D486; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-d);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
#app{max-width:520px;margin:0 auto;padding-block:18px calc(var(--tab-h) + 34px + env(safe-area-inset-bottom,0px))}
.d{font-family:var(--f-d);font-stretch:75%;font-weight:900;text-transform:uppercase;letter-spacing:-.005em;line-height:.88;font-variation-settings:"wdth" 75}
.a{font-family:var(--f-a);font-style:italic;font-weight:500}
.m{font-family:var(--f-m);font-weight:600;letter-spacing:.02em}
.lab{font-family:var(--f-m);font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
h1,h2,h3{margin:0;text-wrap:balance}
h1.d{font-size:clamp(46px,14vw,74px)}
h2.d{font-size:clamp(30px,9vw,40px)}
h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{height:6px}
.hr{height:2px;background:var(--ink);margin:6px 0}
[hidden]{display:none!important}
/* :focus-visible y prefers-reduced-motion: una sola definición, en la capa Cuaderno */

/* botones */
.btn{appearance:none;border:2px solid var(--marron);background:var(--cta);color:var(--cta-ink);border-radius:8px;padding:14px 18px;font-weight:800;font-size:16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-height:50px}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.full{width:100%}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.coral{background:var(--coral);color:#30231F} /* blanco sobre coral = 2,7:1; marrón = 5,5:1 */
.btn.sm{padding:8px 12px;min-height:44px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.btn.xs{padding:5px 10px;min-height:44px;min-width:44px;font-size:13px;box-shadow:none;border-width:1.5px}
.btn[disabled]{opacity:.55;pointer-events:none}
.lnk{appearance:none;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:700;cursor:pointer;position:relative}
.lnk::after{content:"";position:absolute;left:50%;top:50%;width:max(100% + 12px,44px);height:max(100%,44px);transform:translate(-50%,-50%)} /* zona táctil ≥ 44 px */
.ext{display:inline-flex;align-items:center;gap:6px;min-height:44px;border:1.5px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;text-decoration:none;background:var(--card);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ext::after{content:"↗";font-size:12px}
.ext.map::after{content:"⌖"}

/* tarjetas y chips */
.card{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:16px}
.card.flat{border-width:1.5px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;background:var(--chip);font-weight:700;font-size:13px;border:1.5px solid transparent}
.chip.on{background:var(--ink);color:var(--paper)}
button.chip{cursor:pointer}
.pill{display:inline-block;font-family:var(--f-m);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1.5px solid var(--ink)}
.pill.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.pill.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.cap{display:inline;background:var(--card);color:var(--ink);padding:.06em .38em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:1.5}
.note{border-left:4px solid var(--signal);padding:8px 12px;background:var(--chip);border-radius:0 8px 8px 0;font-size:14px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:2px solid var(--ink);border-radius:8px;background:var(--card);padding:12px;font-size:16px;min-height:48px}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.err{color:var(--signal);font-weight:700;font-size:14px}
.av{width:38px;height:38px;border-radius:50%;flex:none;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px;background:var(--z1);color:#30231F;overflow:hidden;background-size:cover;background-position:center}
.av.s{width:28px;height:28px;font-size:12px;border-width:1.5px}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
input[type=range]{accent-color:var(--teal);-webkit-appearance:none;appearance:none;height:44px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--line);border:1.5px solid var(--ink)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--line);border:1.5px solid var(--ink)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--teal)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-11.5px;border-radius:50%;background:var(--teal);border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--teal);border:2px solid var(--ink)}
input[type=range]:disabled{opacity:.45;cursor:default}
.flow input[type=range]{--ink:#30231F;--line:#FFFBF3}
.flow label.row{min-height:48px}
.flow input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:#30231F}
.tramo{font-size:12.5px;color:var(--ink2);margin:-2px 0 8px 2px;padding-left:10px;border-left:2px dashed var(--line)}
.slot .ed{display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bub{padding:9px 12px;border-radius:14px;font-size:14.5px;max-width:88%;border:1.5px solid var(--ink)}
.bub.yo{align-self:flex-end;background:#4EAAA0;color:var(--marron);border-color:var(--marron)}
.bub.zaino{align-self:flex-start;background:var(--card)}
#b-ia svg{width:28px;height:28px}
.marca{display:inline-flex;align-items:center;gap:.02em;color:var(--ink)}
.marca-z{width:.9em;height:.9em;flex:none;margin-right:.02em}
.marca-t{line-height:1}
/* propuestas */
.hero-prog{background:var(--sol);color:var(--marron);border-color:var(--marron)}
.hero-prog .lab{color:var(--marron)}
.hero-prog .meter{background:var(--paper);border-color:var(--marron)}
.hero-prog .meter i{background:var(--marron)}
.prop{padding:0;overflow:hidden}
.prop>.stack{padding:0 16px 16px}
.prop-il{position:relative;height:150px;overflow:hidden;border-bottom:2px solid var(--ink)}
.prop-il svg{width:100%;height:100%;display:block}
.prop-il>svg{position:absolute;inset:0}
.prop-tipo{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:3px 12px 3px 4px;font-weight:800;font-size:13px}
.prop-tipo svg{width:26px;height:26px;position:static}
.pct{font-family:var(--f-d);font-weight:900;font-stretch:75%;font-variation-settings:"wdth" 75;font-size:52px;line-height:.85;color:var(--teal-d)}
.pct small{font-size:24px}
.pp{display:flex;flex-wrap:wrap;gap:6px}
.coste{background:var(--chip);border-radius:10px;padding:10px 12px}
.lst{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.lst li.ok::marker{color:var(--ok)} .lst li.ko::marker,.lst.ko li::marker{color:var(--coral)}
details>summary{cursor:pointer;font-weight:700}
.opts.duelo{grid-template-columns:1fr 1fr;position:relative}
.opts.duelo::after{content:"o";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--sol);color:var(--marron);border:2px solid var(--marron);display:grid;place-items:center;font-weight:900;font-size:18px;pointer-events:none}
.brand{font-family:var(--f-d);font-weight:900;font-stretch:75%;font-variation-settings:"wdth" 75;font-size:28px;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{font-family:var(--f-a);text-transform:none;font-weight:500;font-size:16px;color:var(--ink2)}
.reg{position:relative;display:inline-block}
.reg::before{content:attr(data-t);position:absolute;left:3px;top:2px;color:var(--signal);z-index:-1;mix-blend-mode:multiply}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:2px solid var(--ink);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);align-items:end;height:var(--tab-h)}
.tab{appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--ink2);cursor:pointer;padding:6px 0;letter-spacing:.01em}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--signal)}
.tab.plus{justify-content:center}
.tab.plus span.b{width:58px;height:46px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:4px 3px 0 var(--signal);margin-bottom:2px}
.tab.plus span.b svg{width:28px;height:28px;color:var(--paper)}

/* portada */
.poster{position:relative;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--zbg)}
.poster .art{aspect-ratio:16/10;display:block}
.poster .art svg{display:block}
.poster .tt{position:absolute;left:14px;right:14px;top:14px}
.poster .tt .d{font-size:clamp(44px,15vw,78px);color:#30231F;text-shadow:none}
.poster.dark .tt .d{color:#FFFBF3}
.poster .tt .lab{display:inline-block;background:#30231F;color:#FFFBF3!important;padding:4px 8px;border-radius:4px;margin-bottom:8px}
.poster .tt .d{line-height:.9;display:block}
.hero-intro{padding:18px 0 6px}
.hero-intro h1{font-size:clamp(54px,17vw,92px)}
.hero-intro h1 .r{color:var(--signal)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{display:none}
.strip .mini{flex:none;width:118px;aspect-ratio:9/14;border:2px solid var(--ink);border-radius:10px;overflow:hidden;scroll-snap-align:start;position:relative;background:var(--zbg)}
.strip .mini span{position:absolute;left:8px;bottom:8px;font-family:var(--f-d);font-weight:900;font-stretch:75%;font-variation-settings:"wdth" 75;font-size:20px;text-transform:uppercase;background:#FFFBF3;color:#30231F;padding:0 5px;border-radius:4px}

/* lista de viajes */
.trip{display:flex;gap:12px;align-items:stretch;text-decoration:none;color:inherit;cursor:pointer;padding:0;overflow:hidden;width:100%;text-align:left}
.trip .th{width:96px;flex:none;border-right:2px solid var(--ink);background:var(--zbg)}
.trip .th svg{display:block;height:100%}
.trip .bd{padding:12px 12px 12px 0;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.trip .bd b{font-size:18px;font-weight:900;line-height:1.1}
.meter{height:8px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
.meter i{display:block;height:100%;background:var(--signal)}

/* pantallas de flujo (crear / preguntas) */
.flow{position:fixed;inset:0;z-index:60;background:var(--qbg,#F6DE97);color:#30231F;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.flow .bars{display:flex;gap:4px;max-width:520px;margin:0 auto;width:100%}
.flow .bars i{flex:1;height:4px;border-radius:9px;background:rgba(20,20,20,.22);overflow:hidden;position:relative}
.flow .bars i.done{background:#30231F}
.flow .bars i.cur::after{content:"";position:absolute;inset:0;width:45%;background:#30231F;border-radius:9px}
.flow .hd{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:10px auto 0;width:100%}
.flow .icb{appearance:none;width:44px;height:44px;border-radius:50%;border:2px solid #30231F;background:#FFFBF3;color:#30231F;display:grid;place-items:center;cursor:pointer;font-size:20px;font-weight:900}
.flow .icb[disabled]{opacity:0}
.flow .who{font-family:var(--f-m);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:#30231F;color:#FFFBF3;padding:6px 10px;border-radius:99px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow .body{flex:1;overflow-y:auto;max-width:520px;margin:0 auto;width:100%;padding:14px 2px 10px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.flow .qt{font-family:var(--f-d);font-weight:850;font-size:clamp(25px,7.4vw,34px);line-height:1.18;letter-spacing:-.01em}
.flow .qt .cap{background:#FFFBF3;color:#30231F;padding:.02em .3em}
.flow .qs{font-size:15px;font-weight:600;line-height:1.35}
.flow .qs .cap{background:#30231F;color:#FFFBF3;font-weight:700}
.flow .ft{max-width:520px;margin:0 auto;width:100%;display:flex;gap:10px}
.flow .ft .btn{flex:1}
.flow .btn{border-color:#30231F;box-shadow:3px 3px 0 #30231F}
.flow .lim{margin:0;background:#FFFBF3;color:#30231F;border:2px solid #30231F;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;line-height:1.35}
.flow .btn.ghost{background:#FFFBF3;color:#30231F}
.flow input[type=text],.flow input[type=number],.flow input[type=date],.flow textarea,.flow select{background:#FFFBF3;color:#30231F;border-color:#30231F}
.flow .lab{color:#30231F}
.flow .chip{background:#FFFBF3;color:#30231F;border:1.5px solid #30231F;min-height:44px;padding:10px 14px;font-size:14px}
.flow .chip.on{background:#30231F;color:#FFFBF3}
.flow.enter .body{animation:feedIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes feedIn{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}

/* opciones-pegatina */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.one{grid-template-columns:1fr}
.opt{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:#30231F;position:relative}
.opt .il{width:100%;aspect-ratio:1/1;max-width:170px;border-radius:14px;display:grid;place-items:center;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.opt .il svg{width:82%;height:82%}
.opt:nth-child(odd) .il{transform:rotate(-2.5deg)}
.opt:nth-child(even) .il{transform:rotate(2deg)}
.opt .tx{font-weight:800;font-size:15px;line-height:1.2}
.opt .tx .cap{background:#FFFBF3;color:#30231F}
.opt .sb{font-size:12.5px;font-weight:600;line-height:1.25;max-width:22ch}
.opt.on .il{transform:scale(1.06) rotate(-4deg)}
.opt.on::after{content:"✓";position:absolute;top:-4px;right:6%;width:34px;height:34px;border-radius:50%;background:#30231F;color:#FFFBF3;display:grid;place-items:center;font-weight:900;font-size:18px;border:2px solid #FFFBF3}
.opt.row{flex-direction:row;text-align:left;background:#FFFBF3;border:2px solid #30231F;border-radius:12px;padding:10px;gap:12px;box-shadow:3px 3px 0 #30231F}
.opt.row .il{width:64px;max-width:64px;flex:none;transform:none!important}
.opt.row .sb{max-width:none}
.opt.row.on{background:#30231F;color:#FFFBF3}
.opt.row.on .tx .cap{background:#30231F;color:#FFFBF3}
.opt.row.on::after{top:-10px;right:-6px}
.cities{display:flex;flex-wrap:wrap;gap:8px}

/* swipe */
.deck{position:relative;height:min(58vh,440px);margin-top:4px}
.sw{position:absolute;inset:0;background:#FFFBF3;border:2px solid #30231F;border-radius:16px;box-shadow:5px 5px 0 #30231F;display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;color:#30231F}
.sw.next{transform:scale(.95) translateY(14px) rotate(-1.5deg);opacity:.85}
.sw .top-il{height:44%;display:grid;place-items:center;border-bottom:2px solid #30231F}
.sw .top-il svg{height:84%;width:auto}
.sw .in{padding:14px 16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.sw .in h3{font-family:var(--f-d);font-weight:900;font-stretch:75%;font-variation-settings:"wdth" 75;text-transform:uppercase;font-size:28px;line-height:.95}
.sw .stamp{position:absolute;top:18px;font-family:var(--f-m);font-weight:700;font-size:22px;letter-spacing:.06em;border:3px solid currentColor;border-radius:8px;padding:2px 10px;opacity:0;pointer-events:none;background:#FFFBF3}
.sw .st-l{right:16px;color:#2F7F77;transform:rotate(10deg)} .sw .st-r{left:16px;color:#B03A2E;transform:rotate(-10deg)} .sw .st-s{left:50%;transform:translateX(-50%);color:#754A77}
.swb{display:flex;justify-content:center;gap:18px;margin-top:10px}
.swb button{width:62px;height:62px;border-radius:50%;border:2px solid #30231F;background:#FFFBF3;color:#30231F;font-size:24px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #30231F;display:grid;place-items:center}
.swb button.s{width:52px;height:52px;align-self:center;font-size:20px}
.swb button:active{transform:translate(3px,3px);box-shadow:none}

/* plan */
